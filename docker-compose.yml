# docker compose up --build  →  http://localhost:8000
#
# SECRET_KEY и OPENAI_API_KEY берутся из файла .env рядом с этим файлом
# (см. .env.docker.example). Без OPENAI_API_KEY система работает, но без ИИ-функций.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lmssi
      POSTGRES_USER: lmssi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lmssi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmssi -d lmssi"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lmssi:${POSTGRES_PASSWORD:-lmssi}@db:5432/lmssi
      SECRET_KEY: ${SECRET_KEY:?Задайте SECRET_KEY в .env (openssl rand -hex 32)}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.impact-relay.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-claude-sonnet-4.6}
      SEED_DEMO: ${SEED_DEMO:-1}
      # Кнопки «Войти как …» без пароля и ограничения для общих демо-аккаунтов
      DEMO_MODE: ${DEMO_MODE:-1}
      CORS_ORIGINS: '["http://localhost:8000"]'
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
