# Конфиг Alembic. URL базы берётся из app.config (DATABASE_URL в .env),
# поэтому здесь его нет.
#
#   alembic revision --autogenerate -m "описание"   # новая миграция из моделей
#   alembic upgrade head                             # применить вручную
#
# При обычном запуске backend миграции применяются сами (app/db_migrate.py).

[alembic]
script_location = %(here)s/app/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
